simulation:
  main_dir: /cosma8/data/dp004/colibre/Runs #do not touch!
  chimes_table_dir: /cosma8/data/dp004/jlvc76/COLIBRE/Tables/equilibrium_rates_and_speciesfractions/abundances_full/ #this is where the chimes tables are stored, change if necessary
  box_length: 100 #cMpc
  resolution: 6 # 10^resolution  M_solar 
  name: Thermal
  snapshot_number: 127 #can be a single int or list of ints

data_output:
  main_dir: /cosma8/data/do012/dc-kort1/CGM/ #this is where the I store my outputs, change if necessary
  results_dir: test_gal 


window:
    x: [0.0, 1.0]
    y: [0.0, 1.0]
    z: [0.0, 0.2]
    projection_axis: z
    resolution: 100 #number of bins in the histogram (2D histogram is shape(resolutions,resolution))
    z_center: 0.01
    z_range: [0.0,0.02]

chemistry:
  element: hydrogen
  ion: [Hm,HI,HII]

galaxy:
  #Bool to select single galaxy mode
  single_galaxy: on
  #choose: exclusive_sphere, inclusive_sphere, projected_aperture, bound_subhalo,  
  #WILL ADD MORE BUT THIS WILL BE DONE LATER
  galaxy_window: inclusive_sphere 
  extend_value: 100 #kpc physical, the extend of the window around the galaxy in the histograms 
  #choose: kpc, pc
  extend_unit: kpc
  # choose: random, highest_gas_mass, most_bound_particles,
  selection: highest_gas_mass # choose: random, highest_gas_mass, most_bound_particles,
  

monitoring:
  cpu_ram_monitor: off
  monitor_interval: 240 #in seconds
